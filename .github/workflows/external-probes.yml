name: Check external probe images

on:
  pull_request:
    paths:
      - controller/**
      - throughput-probe/**
      - user-plane-path/**
      - n3-oneway/target_process.py
      - common/tunnel_identity.py
      - .github/workflows/external-probes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            dockerfile: controller/Dockerfile.external
          - component: throughput
            dockerfile: throughput-probe/Dockerfile
          - component: user-plane-path
            dockerfile: user-plane-path/Dockerfile
    env:
      COMPONENT: ${{ matrix.component }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the external probe image
        run: docker build --pull --platform linux/amd64 --file "$DOCKERFILE" --tag "nador-external-$COMPONENT:pr" .
      - name: Check packaged Python source
        run: docker run --rm --network none --entrypoint python3 "nador-external-$COMPONENT:pr" -m compileall -q /app
      - name: Check that the external controller does not bundle the injector
        if: matrix.component == 'controller'
        run: |
          docker run --rm --network none --entrypoint python3 "nador-external-$COMPONENT:pr" -c '
          from pathlib import Path
          import external_controller
          assert not Path("/app/k8scontroller.py").exists()
          '
