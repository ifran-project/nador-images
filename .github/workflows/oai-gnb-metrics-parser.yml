name: OAI gNB metrics parser

on:
  pull_request:
    paths:
      - 'oai-gnb-metrics-parser/**'
      - '.github/workflows/oai-gnb-metrics-parser.yml'
  push:
    branches: [main]
    paths:
      - 'oai-gnb-metrics-parser/**'
      - '.github/workflows/oai-gnb-metrics-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oai-gnb-metrics-parser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ifran-project/oai-gnb-metrics-parser
      VERSION: '2026.w38'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build from source
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" oai-gnb-metrics-parser
      - name: Test the metrics endpoint
        run: bash oai-gnb-metrics-parser/smoke-test.sh "$IMAGE:$VERSION"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'ifran-project/nador-images'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'ifran-project/nador-images'
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
